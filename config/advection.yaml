# Advection u_t + beta u_x = 0 (data: 10000 fields, 256 t x 256 x).
gov_eqs: advection
advection_beta: 1.0
# Weight of the physics term. The paper's grids:
#   anchored  2e3, 2e4, 2e5, 2e6
#   pidm      1e-3, 1e-2, 1e-1, 1     (pidm c = anchored c / 2e6 on advection)
c_residual: 20000.0
# advection is evaluated with an average of the weights; its checkpoints swing without one
ema_decay: 0.999
ema_start: 1000

# The paper's protocol for the PDEs: a fixed budget of 100k iterations, evaluated at the final step on
# 1000 generated samples. Seed 0 for the weights, the data split and the normalisation's tangents.
method: anchored          # anchored, pidm, dm, or lin / norm for the ablation (src/methods/registry.py)
c_data: 1.0
diff_steps: 100
snr_gamma: 5.0            # data term weighted by min(SNR_t, 5)

train_iterations: 100000
train_batch_size: 8
learning_rate: 0.0001
seed: 0
data_split_seed: 0
physics_probe_seed: 0
physics_probes: 1
# 256 training fields are left out of training in every paper run
holdout_size: 256
holdout_seed: 12345

test_eval_freq: 500
checkpoint_freq: 5000
sample_residual_freq: 5000
sample_count: 9
log_freq: 20
generate_after_training: true
generation_num_samples: 1000
generation_eval_batch_size: 32

name: run
data_dir: ./data
wandb_track: false
